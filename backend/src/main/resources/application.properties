spring.application.name=query-monitor

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/query_monitor}
spring.datasource.username=${DB_USERNAME:query_monitor}
spring.datasource.password=${DB_PASSWORD:query_monitor}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

monitored.datasource.url=${MONITORED_DB_URL:jdbc:postgresql://localhost:5432/monitored_db}
monitored.datasource.username=${MONITORED_DB_USERNAME:query_monitor}
monitored.datasource.password=${MONITORED_DB_PASSWORD:query_monitor}
monitored.datasource.driver-class-name=org.postgresql.Driver

# TEST AMACLI: gercek saatlik/gunluk yerine her 15 saniyede calissin.
# Test bitince bu iki satiri SIL (varsayilanlar devreye girsin: gercek
# saat basi / gece yarisi).
scheduler.hourly-cron=*/15 * * * * *
scheduler.daily-cron=*/15 * * * * *
