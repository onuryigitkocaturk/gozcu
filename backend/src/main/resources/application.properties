spring.application.name=query-monitor

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/query_monitor}
spring.datasource.username=${DB_USERNAME:query_monitor}
spring.datasource.password=${DB_PASSWORD:query_monitor}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# her proje kendi izledigi veritaban?n?n ba?lanti bilgisini ta??yor. sifre bu anahtarla
# sifrelenip saklaniyor. JWT_SECRET gibi kodda sabit deger yok, env variable'da tutulmali.
connection.encryption.key=${CONNECTION_ENCRYPTION_KEY}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
notification.mail.from=noreply@query-monitor.local

# TEST AMACLI (deneme ortami): HOURLY her 1 dakikada, DAILY her 1.5
# dakikada (90000 ms) bir calissin. Test bitince bu iki satir SILINMELI
# ki gercek degerlere (1 saat / 1 gun) donsun.
scheduler.hourly-rate-ms=60000
scheduler.daily-rate-ms=90000
